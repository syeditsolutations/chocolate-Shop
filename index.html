<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chocolate Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍫 Sweet Chocolate Shop</h1>
  <p>Delicious handmade chocolates</p>
</header>

<section class="products">

  <div class="card">
    <h2>Dark Chocolate</h2>
    <p>Rich & healthy</p>
    <p class="price">$10</p>
    <button>Buy Now</button>
  </div>

  <div class="card">
    <h2>Milk Chocolate</h2>
    <p>Creamy & smooth</p>
    <p class="price">$12</p>
    <button>Buy Now</button>
  </div>

  <div class="card">
    <h2>White Chocolate</h2>
    <p>Sweet & soft</p>
    <p class="price">$11</p>
    <button>Buy Now</button>
  </div>

</section>

<footer>
  <p>© 2025 Sweet Chocolate Shop</p>
</footer>

</body>
</html>
