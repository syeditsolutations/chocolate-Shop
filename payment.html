<!DOCTYPE html>
<html>
<head>
  <title>Payment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>💳 Payment</h1>

<form action="confirm.html">

  <label>Product</label><br>
  <input type="text" id="product" name="product" readonly><br><br>

  <label>Price ($)</label><br>
  <input type="text" id="price" name="price" readonly><br><br>

  <h3>Customer Details</h3>

  <input type="text" name="name" placeholder="Full Name" required><br><br>
  <input type="email" name="email" placeholder="Email" required><br><br>
  <input type="text" name="phone" placeholder="Phone Number" required><br><br>

  <h3>Card Details (Demo)</h3>

  <input type="text" placeholder="Card Number" required><br><br>
  <input type="text" placeholder="MM/YY" required><br><br>
  <input type="text" placeholder="CVV" required><br><br>

  <button type="submit">Pay Now</button>

</form>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("product").value = params.get("product");
  document.getElementById("price").value = params.get("price");
</script>

</body>
</html>
