<!DOCTYPE html>
<html>
<head>
  <title>Place Order</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🛒 Place Your Order</h1>

<form action="confirm.html">

  <label>Product</label><br>
  <input type="text" id="product" name="product" readonly><br><br>

  <label>Price ($)</label><br>
  <input type="text" id="price" name="price" readonly><br><br>

  <label>Your Name</label><br>
  <input type="text" name="name" required><br><br>

  <label>Email</label><br>
  <input type="email" name="email" required><br><br>

  <label>Phone</label><br>
  <input type="text" name="phone" required><br><br>

  <button type="submit">Confirm Order</button>

</form>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("product").value = params.get("product");
  document.getElementById("price").value = params.get("price");
</script>

</body>
</html>
